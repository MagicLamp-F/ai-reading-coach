services:
  reading-coach:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  feedback-server:
    build: .
    env_file: .env
    command: ["python", "-m", "app.cli", "run-api", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  web:
    image: node:24-alpine
    working_dir: /app/web
    command: ["sh", "-c", "npm install && ARC_API_PROXY_TARGET=http://feedback-server:8000 npm run dev"]
    ports:
      - "8010:8010"
    volumes:
      - .:/app
    depends_on:
      - feedback-server
    restart: unless-stopped
